# Auto-deploy: every push to this branch runs the tests and, if they pass,
# ships straight to Cloudflare. Needs two repository secrets (Settings →
# Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — dash.cloudflare.com → My Profile → API Tokens
#                            → Create Token → "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  — dash.cloudflare.com → Workers & Pages →
#                            right-hand sidebar "Account ID"
name: Deploy

# NOTE: push-triggered deploys are handled by Cloudflare Workers Builds
# (the Git integration in the Cloudflare dashboard), because GitHub-hosted
# runners never picked up jobs for this account — three runs in a row were
# queued ~15 minutes with no runner assigned, then auto-cancelled. This
# workflow stays as a manual backup only.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
